name: Windows64

on:
  schedule:
    - cron:  '0 1 * * *'
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        include:
        - arch: x86_64
          arch2: amd64
          bit: 64
          target: x86-64
    env:
      LISP: sbcl-bin
      RESULT_NAME: windows-${{ matrix.arch2 }}
      RESULT_PATH: windows-${{ matrix.arch2 }}
      RESULT_PATH_SUB: roswell
      SBCL_OPTIONS: --fancy
      ARCH: ${{ matrix.target }}
      VERSION: ${{ secrets.VERSION }}
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    environment: SET_VERSION

    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2.17.0
      with:
        msystem: UCRT64
        path-type: inherit
        release: true
        update: true
        install: 'base-devel mingw-w64-ucrt-${{ matrix.arch }}-toolchain curl unzip'
    - name: Run MSYS2 once
      shell: msys2 {0}
      run: |
        pwd
        echo $MSYSTEM
        echo $MSYS2_PATH_TYPE
        echo $PATH
    - name: install roswell
      shell: msys2 {0}
      run: |
        gcc -v
        curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
        ros install snmsts/sn.github roswell/sbcl_bin
    - name: build sbcl
      shell: msys2 {0}
      run: |
        make zstd
        find /ucrt64 | grep zstd || true
        rm -f /ucrt64/lib/libzstd.dll.a
        if [ -f /ucrt64/bin/libzstd.dll ]; then mv /ucrt64/bin/libzstd.dll /ucrt64/bin/libzstd.dll_; fi
        bash -c 'cd zstd/lib;make CFLAGS="-fPIC" libzstd.a-release;cp libzstd.a /ucrt64/lib;cp *.h /ucrt64/include'
        if [ "$VERSION" = "" ]; then
          OS=windows make latest-version compile archive;
        else
          OS=windows make compile archive;
        fi
    - name: upload
      shell: msys2 {0}
      run: |
        ls
        if [ "$VERSION" = "" ]; then
          make latest-version upload-archive;
        else
          make upload-archive;
        fi

